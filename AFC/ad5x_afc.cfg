# (C) 2024-2026 ghzserg https://github.com/ghzserg/zmod
# Full AFC (AFCProject AFC-Klipper-Add-On) with the AD5X IFS as an AFC unit
# (.shell/AFC_IFS.py). Included by fix_config.sh when afc = 2 and display_off = 1.
#
# Zmod does the filament work (INSERT_PRUTOK_IFS, REMOVE_PRUTOK_IFS,
# _A_CHANGE_FILAMENT: cut, trash, purge, heat), so AFC's own cut, park, poop,
# kick, wipe, tip forming and z_hop are off. To change an option, add the same
# section with your option to mod_data/user.cfg; yours wins.

[AFC]
VarFile: /usr/data/config/mod_data/AFC/AFC.var
default_material_temps: default: 220, PLA:220, PETG:240, ABS:250, ASA:250, TPU:230
load_to_hub: False
assisted_unload: False
enable_sensors_in_gui: False
z_hop: 0
tool_cut: False
park: False
poop: False
kick: False
wipe: False
form_tip: False
# G28 before a tool load or unload when not homed
auto_home: True
# Several T(n) per lane: the Zmod color dialog may map two tools to one slot
enable_multiple_mapping: True

[AFC_prep]
enable: True

# The IFS reports slots empty and flapping for several seconds after start
[delayed_gcode afc_welcome]
initial_duration: 15
gcode:
    PREP

[AFC_extruder extruder]
# The head sensor is Zmod's ADC sensor; AFC_IFS mirrors it as tool_start_state

[AFC_hub IFS]
switch_pin: virtual
afc_bowden_length: 1000

[AFC_IFS IFS]
hub: IFS
extruder: extruder

[AFC_lane lane1]
unit: IFS:1
map: T0

[AFC_lane lane2]
unit: IFS:2
map: T1

[AFC_lane lane3]
unit: IFS:3
map: T2

[AFC_lane lane4]
unit: IFS:4
map: T3
